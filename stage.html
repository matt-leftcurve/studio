<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<title>FULLPORTMATT stage</title>
<style>
	html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
	#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
	.panel { position: absolute; overflow: hidden; background: transparent; display: none; }
	.panel iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
	.panel.empty { background: #0e1a2b; }
	.overlay { position: absolute; inset: 0; width: 1920px; height: 1080px; border: 0; pointer-events: none; z-index: 10; background: transparent; display: none; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// FULLPORTMATT stage page. One definition of each guest layout.
// In OBS: ONE browser source (1920x1080, stretched to the canvas) shared by every "Stage - …" scene. OBS tells
// the page which scene is live (window.obsstudio / obsSceneChanged) and the page switches layout itself:
// no reload, guests stay connected, each guest is pulled once (full-quality scene view by stream ID).
// Matt's panel is transparent in OBS (native camera layer underneath).
// Params: g1, g2 = guest stream IDs; h1, h2 = @handles; room (fpmshow); layout = default when OBS gives no
// scene; mode=obs (default) | view (draws Matt's panel from the host feed too and scales to the window);
// audio=1 lets guest audio play (OBS routes it monitor-only, like the old per-guest sources).
(function () {
	var q = new URLSearchParams(location.search);
	var ROOM = q.get("room") || "fpmshow";
	var MODE = q.get("mode") || "obs";
	var AUDIO = q.get("audio") === "1";
	var HOST = q.get("host") || "FPMHOST";
	// self=<id>: embedded in that guest's own page; their panel (and their own screen share) stays transparent so
	// the page can show its LOCAL camera/share underneath (zero delay, no self-view over the network).
	var SELF = q.get("self") || "";
	var LAYOUTS = {
		solo: { overlay: "stage/retro-solo.html", panels: { host: [0, 0, 1920, 1080] } },
		sbs: { overlay: "stage/retro-sbs.html", panels: { host: [0, 165, 950, 810], g1: [970, 165, 950, 810] } },
		trio: { overlay: "stage/retro-trio.html", panels: { host: [0, 165, 630, 810], g1: [645, 165, 630, 810], g2: [1290, 165, 630, 810] } },
		// share: screen large, Matt top-right, the SHARING guest's camera bottom-right ("sharer" is g1 or g2)
		// share: screen large + three stacked tiles: Matt, guest 1, guest 2 (2026-11-04; was screen + Matt + sharer only)
		share: { overlay: "stage/retro-share.html", panels: { share: [0, 165, 1380, 810], host: [1395, 165, 525, 262], g1: [1395, 439, 525, 262], g2: [1395, 713, 525, 262] } },
		// Guest/host views only (OBS never shows stage.html in these scenes): intro screen with everyone in a tile
		// strip, and the solo scene with the guests in small tiles so they still see themselves/each other.
		intro: { overlay: "stage/intro.html", under: true, panels: { host: [340, 775, 400, 225], g1: [760, 775, 400, 225], g2: [1180, 775, 400, 225] } },
		solo_pip: { overlay: "stage/retro-solo.html", panels: { host: [0, 0, 1920, 1080], g1: [1530, 200, 360, 203], g2: [1530, 418, 360, 203] }, tiles: ["g1", "g2"] }
	};
	var stage = document.getElementById("stage");

	function viewUrl(id) {
		var u = "./?view=" + encodeURIComponent(id) + "&scene&room=" + encodeURIComponent(ROOM) + "&cover&label=Full_Port_Matt&opusbitrate=128";
		if (!AUDIO) {
			u += "&noaudio";
		}
		// &dpr=N (guest/host views): request N x the panel's pixel size so small tiles stay sharp on screen
		if (q.get("dpr")) {
			u += "&dpr=" + encodeURIComponent(q.get("dpr"));
		}
		// &maxh=N (guest/host views): ask each sender for a FIXED N-line picture instead of panel-sized/1080p. Senders
		// (guest laptops) software-encode one copy per viewer; 1080p copies made them CPU-bound and laggy in trio.
		// OBS's stage view never sets this, so the stream keeps full quality.
		if (q.get("maxh")) {
			u += "&viewheight=" + encodeURIComponent(q.get("maxh"));
			// people's views: never let VDO's "hidden scene" saver throttle a view (host page dropped Carol in and out
			// while OBS and the laptop kept her, 2026-11-04)
			u += "&nohiddensceneoptimization";
		}
		// &vcodec=h264 (guest/host views only): ask senders for H.264, which Macs/most PCs encode in HARDWARE; VP8 is
		// always software. OBS's stage view never sets this (OBS's browser can't play H.264), so OBS stays VP8.
		// &ice=<srflx|relay> (TEST ONLY): VDO icefilter = keep only that candidate type, i.e. never use the home LAN;
		// simulates guests coming in over the internet when testing with devices in the same house.
		if (q.get("ice")) {
			u += "&icefilter=" + encodeURIComponent(q.get("ice"));
		}
		// &vbr=N kbps (guest/host views): cap what each sender spends on THIS viewer, so a guest on weak upload keeps
		// most of it for the OBS stream copy. OBS's view never sets this.
		if (q.get("vbr")) {
			u += "&videobitrate=" + encodeURIComponent(q.get("vbr"));
		}
		if (q.get("vcodec")) {
			u += "&codec=" + encodeURIComponent(q.get("vcodec"));
		}
		return u;
	}

	// Panels are created once and only moved/shown/hidden on layout change (no reconnects).
	var panels = {};
	["host", "g1", "g2"].forEach(function (role) {
		var div = document.createElement("div");
		div.className = "panel";
		var id = role === "host" ? (MODE === "obs" ? "" : HOST) : q.get(role) || "";
		var isSelf = !!SELF && id === SELF;
		if (isSelf) id = "";
		if (id) {
			var f = document.createElement("iframe");
			f.allow = "autoplay";
			f.src = viewUrl(id);
			div.appendChild(f);
		} else if (role !== "host" && !isSelf) {
			div.className += " empty";
		}
		stage.appendChild(div);
		panels[role] = div;
	});

	// Screen shares: VDO publishes a share as "<ID>:s" — guests (g1/g2) and the HOST (FPMHOST:s, 2026-11-05)
	// alike. Pull all three (idle until a share exists, no cost) into one share panel; the "sharer" role picks
	// which one shows.
	var sharePanel = document.createElement("div");
	sharePanel.className = "panel";
	sharePanel.style.background = "#000";
	stage.appendChild(sharePanel);
	var shareFrames = {};
	["host", "g1", "g2"].forEach(function (role) {
		var id = role === "host" ? HOST : q.get(role);
		if (!id || (SELF && id === SELF)) return;
		var f = document.createElement("iframe");
		f.allow = "autoplay";
		f.src = viewUrl(id + ":s").replace("&cover", "");
		f.style.display = "none";
		sharePanel.appendChild(f);
		shareFrames[role] = f;
	});
	function liveShare() {
		var roles = Object.keys(shareFrames);
		for (var i = 0; i < roles.length; i++) {
			try {
				var w = shareFrames[roles[i]].contentWindow;
				var rp = w && w.session && w.session.rpcs;
				if (!rp) continue;
				for (var U in rp) {
					var st = rp[U] && (rp[U].streamSrc || (rp[U].videoElement && rp[U].videoElement.srcObject));
					if (st && st.getVideoTracks && st.getVideoTracks().some(function (t) { return t.readyState === "live" && !t.muted; })) {
						return roles[i];
					}
				}
			} catch (e) {}
		}
		return "";
	}
	var sharer = "";
	var sharerHint = ""; // role, from the embedding page's {fpmStage:{sharer:<id>}}

	// Tags: prefer the seated guests' NAMES (n1/n2, from their join labels); explicit h1/h2 @handles are the
	// legacy fallback, so an old-style URL (h1/h2 only) still renders. The overlays keep their h1/h2 params.
	function tag(n) { return q.get("n" + n) || q.get("h" + n) || ""; }
	var oq = new URLSearchParams();
	if (tag(1)) oq.set("h1", tag(1));
	if (tag(2)) oq.set("h2", tag(2));
	var overlays = {};
	Object.keys(LAYOUTS).forEach(function (name) {
		var ov = document.createElement("iframe");
		ov.className = "overlay";
		ov.src = LAYOUTS[name].overlay + (oq.toString() ? "?" + oq.toString() : "");
		stage.appendChild(ov);
		overlays[name] = ov;
	});

	var current = "";
	function setLayout(name) {
		if (!LAYOUTS[name] || name === current) {
			return;
		}
		current = name;
		var L = LAYOUTS[name];
		Object.keys(panels).forEach(function (role) {
			var r = L.panels[role] || (name === "share" && role === sharer ? L.panels.sharer : null);
			var div = panels[role];
			if (!r) {
				div.style.display = "none";
				return;
			}
			div.style.display = "block";
			var isTile = L.under || (L.tiles && L.tiles.indexOf(role) !== -1);
			div.style.zIndex = isTile ? "20" : "";
			div.style.borderRadius = isTile ? "10px" : "";
			div.style.boxShadow = isTile ? "0 0 0 3px #7fd4c1, 0 8px 24px rgba(0,0,0,.6)" : "";
			div.style.left = r[0] + "px";
			div.style.top = r[1] + "px";
			div.style.width = r[2] + "px";
			div.style.height = r[3] + "px";
		});
		var sr = L.panels.share;
		sharePanel.style.display = sr ? "block" : "none";
		sharePanel.style.background = SELF && q.get(sharer) === SELF ? "transparent" : "#000";
		if (sr) {
			sharePanel.style.left = sr[0] + "px";
			sharePanel.style.top = sr[1] + "px";
			sharePanel.style.width = sr[2] + "px";
			sharePanel.style.height = sr[3] + "px";
			Object.keys(shareFrames).forEach(function (role) {
				shareFrames[role].style.display = role === sharer ? "block" : "none";
			});
			var want = "stage/retro-share.html?h1=" + encodeURIComponent(tag(1)) + "&h2=" + encodeURIComponent(tag(2));
			if (overlays.share.getAttribute("data-src") !== want) {
				overlays.share.setAttribute("data-src", want);
				overlays.share.src = want;
			}
		}
		Object.keys(overlays).forEach(function (n) {
			overlays[n].style.display = n === name ? "block" : "none";
			overlays[n].style.zIndex = LAYOUTS[n].under ? "0" : "";
		});
		document.title = "FULLPORTMATT stage · " + name;
	}

	function layoutForScene(sceneName) {
		var s = String(sceneName || "").toLowerCase();
		if (s.indexOf("share") !== -1) return "share";
		if (s.indexOf("trio") !== -1) return "trio";
		if (s.indexOf("sbs") !== -1) return "sbs";
		if (s.indexOf("solo") !== -1) return "solo";
		return "";
	}

	setLayout(q.get("layout") || "trio");
	setInterval(function () {
		var now = sharerHint || liveShare() || sharer || "g1";
		if (now !== sharer) {
			sharer = now;
			if (current === "share") {
				var keep = current;
				current = "";
				setLayout(keep);
			}
		}
	}, 1000);

	// OBS integration: follow the live scene.
	if (window.obsstudio) {
		try {
			window.obsstudio.getCurrentScene(function (scene) {
				var l = layoutForScene(scene && scene.name);
				if (l) setLayout(l);
			});
		} catch (e) {}
		window.addEventListener("obsSceneChanged", function (ev) {
			var l = layoutForScene(ev.detail && ev.detail.name);
			if (l) setLayout(l);
		});
	}
	// Also accept postMessage({fpmStage:{layout}}) for non-OBS embeds (guest/host views).
	window.addEventListener("message", function (ev) {
		var d = ev.data;
		if (d && d.fpmStage && "sharer" in d.fpmStage) {
			var sid = d.fpmStage.sharer || "";
			sharerHint = sid === HOST ? "host" : sid && sid === q.get("g1") ? "g1" : sid && sid === q.get("g2") ? "g2" : "";
		}
		if (d && d.fpmStage && d.fpmStage.layout) setLayout(d.fpmStage.layout);
	});
	window.fpmStage = { setLayout: setLayout, layout: function () { return current; } };

	function fit() {
		if (MODE === "obs") {
			return;
		}
		var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
		stage.style.transform = "scale(" + s + ")";
	}
	window.addEventListener("resize", fit);
	fit();
})();
</script>
</body>
</html>
