<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<title>FULLPORTMATT stage</title>
<style>
	html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
	#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
	.panel { position: absolute; overflow: hidden; background: #0e1a2b; display: none; }
	.panel.clear { background: transparent; }
	.panel iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
	#sharepanel { position: absolute; overflow: hidden; background: #000; display: none; }
	#sharepanel iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; }
	.tileframe { position: absolute; box-sizing: border-box; border: 2px solid rgba(201,161,95,0.45);
		box-shadow: inset 0 0 28px rgba(0,0,0,0.4); pointer-events: none; z-index: 12; display: none; }
	.nametag { position: absolute; display: none; align-items: center; gap: 8px; z-index: 13; pointer-events: none;
		background: rgba(10,22,30,0.88); border: 2px solid rgba(201,161,95,0.55); border-radius: 6px;
		padding: 5px 12px 5px 8px; font-family: "Helvetica Neue",Helvetica,Arial,sans-serif; }
	.nametag .icon { font-weight: 800; font-size: 17px; color: #0b1a20; background: #7fd4c1; border-radius: 5px;
		width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
	.nametag .nm { color: #9fe0d0; font-size: 19px; font-weight: 700; letter-spacing: 1px;
		text-shadow: 0 0 8px rgba(127,212,193,0.4); white-space: nowrap; max-width: 300px; overflow: hidden; }
	.overlay { position: absolute; inset: 0; width: 1920px; height: 1080px; border: 0; pointer-events: none;
		z-index: 10; background: transparent; display: none; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="fpm-layouts.js"></script>
<script>
// FULLPORTMATT stage v2 (2026-11-05, SPEC v2 "Onstage"): ONE definition of the stage for OBS, host
// and guests. The cast (onstage guests, ordered, Matt implicit first) arrives via ?cast=<JSON
// [[id,name],...]>; layout = fpmLayouts.gridLayout / shareLayout over people = 1 + cast.length.
// Share is a STATE (sharer id via postMessage from people's pages, or detected from the share
// streams in OBS), not a scene. Tile frames + name tags are drawn HERE for any cast size; the band
// art (logo/bands/ticker/social) is the single retro-solo overlay. Legacy g1/g2/h/n URLs still
// render (mapped to a cast) during migration. Cast changes arrive as a new URL (the host page
// rewrites the OBS input URL / people's pages reload the iframe) — reconnect-on-change, by design.
(function () {
	var q = new URLSearchParams(location.search);
	var LGEO = window.fpmLayouts;
	var ROOM = q.get("room") || "fpmshow";
	var MODE = q.get("mode") || "obs"; // obs = native camera under a transparent host tile; view = draw host too
	var AUDIO = q.get("audio") === "1";
	var HOST = q.get("host") || "FPMHOST";
	var SELF = q.get("self") || ""; // this person's own id: their tile (and own share) stays transparent
	var BUILD = q.get("b") || "";
	var HOSTTAG = q.get("hosttag") || "@FullPortMatt";

	function parseCast() {
		try {
			if (q.get("cast")) {
				return JSON.parse(q.get("cast")).slice(0, 8).map(function (m) { return [String(m[0]), String(m[1] || "")]; });
			}
		} catch (e) {}
		var legacy = [];
		if (q.get("g1")) legacy.push([q.get("g1"), q.get("n1") || q.get("h1") || ""]);
		if (q.get("g2")) legacy.push([q.get("g2"), q.get("n2") || q.get("h2") || ""]);
		return legacy;
	}
	var cast = parseCast();
	var people = [["__host", HOSTTAG]].concat(cast); // index 0 = Matt, always

	function viewUrl(id) {
		var u = "./?view=" + encodeURIComponent(id) + "&scene&room=" + encodeURIComponent(ROOM) + "&cover&label=Full_Port_Matt&opusbitrate=128";
		if (!AUDIO) u += "&noaudio";
		if (q.get("dpr")) u += "&dpr=" + encodeURIComponent(q.get("dpr"));
		if (q.get("maxh")) u += "&viewheight=" + encodeURIComponent(q.get("maxh")) + "&nohiddensceneoptimization";
		if (q.get("ice")) u += "&icefilter=" + encodeURIComponent(q.get("ice"));
		if (q.get("vbr")) u += "&videobitrate=" + encodeURIComponent(q.get("vbr"));
		if (q.get("vcodec")) u += "&codec=" + encodeURIComponent(q.get("vcodec"));
		return u;
	}

	var stage = document.getElementById("stage");

	// one panel + frame + tag per person
	var panels = [], frames = [], tags = [];
	people.forEach(function (p, i) {
		var id = p[0], name = p[1];
		var div = document.createElement("div");
		div.className = "panel";
		var remoteId = id === "__host" ? (MODE === "obs" ? "" : HOST) : id;
		var isSelf = !!SELF && remoteId === SELF;
		if (id === "__host" && MODE === "obs") div.className += " clear"; // native camera layer underneath
		if (isSelf) { remoteId = ""; div.className += " clear"; } // own camera drawn locally by the embedding page
		if (remoteId) {
			var f = document.createElement("iframe");
			f.allow = "autoplay";
			f.src = viewUrl(remoteId);
			div.appendChild(f);
		}
		stage.appendChild(div);
		panels.push(div);
		var fr = document.createElement("div");
		fr.className = "tileframe";
		stage.appendChild(fr);
		frames.push(fr);
		var tg = document.createElement("div");
		tg.className = "nametag";
		var showBadge = name.charAt(0) === "@";
		tg.innerHTML = (showBadge ? '<div class="icon">&#120143;</div>' : "") + '<div class="nm"></div>';
		tg.querySelector(".nm").textContent = name;
		if (!name) tg.style.visibility = "hidden";
		stage.appendChild(tg);
		tags.push(tg);
	});

	// share panel: one visible slot; hidden idle view per possible sharer (host + each cast member)
	var sharePanel = document.createElement("div");
	sharePanel.id = "sharepanel";
	stage.appendChild(sharePanel);
	var shareFrames = {}; // sharer id -> iframe
	people.forEach(function (p) {
		var sid = p[0] === "__host" ? HOST : p[0];
		if (SELF && sid === SELF) return; // own share is drawn locally by the embedding page
		var f = document.createElement("iframe");
		f.allow = "autoplay";
		f.src = viewUrl(sid + ":s").replace("&cover", "");
		sharePanel.appendChild(f);
		shareFrames[sid] = f;
	});

	// overlays: band art always (retro-solo = logo/bands/ticker/social), intro art for the intro layout
	function ovSrc(p) { return p + "?b=" + encodeURIComponent(BUILD); }
	var bandOv = document.createElement("iframe");
	bandOv.className = "overlay";
	bandOv.src = ovSrc("stage/retro-solo.html");
	stage.appendChild(bandOv);
	var introOv = document.createElement("iframe");
	introOv.className = "overlay";
	introOv.src = ovSrc("stage/intro.html");
	stage.appendChild(introOv);

	var current = "";   // "onstage" | "intro"
	// Sharer is AUTHORITATIVE STATE, never inferred from pixels (2026-11-06 audit: a stopped VDO ':s'
	// stream stays "live", so detection stuck OBS in share layout). OBS gets it from the URL (?sharer=,
	// written by the host page — a share toggle reloads this source, ~2-4s, accepted); people's views
	// get it instantly via postMessage from their page.
	var sharer = q.get("sharer") || "";
	var sharerHint = null;

	function place(el, r, show) {
		el.style.display = show ? "block" : "none";
		if (!show) return;
		el.style.left = r[0] + "px"; el.style.top = r[1] + "px";
		el.style.width = r[2] + "px"; el.style.height = r[3] + "px";
	}

	function apply() {
		var n = people.length;
		var intro = current === "intro";
		var rects, shareRect = null;
		if (intro) {
			rects = LGEO.introStrip(n);
		} else if (sharer) {
			var sl = LGEO.shareLayout(n);
			rects = sl.tiles; shareRect = sl.share;
		} else {
			rects = LGEO.gridLayout(n);
		}
		people.forEach(function (p, i) {
			place(panels[i], rects[i], true);
			panels[i].style.zIndex = intro ? "20" : "";
			panels[i].style.borderRadius = intro ? "10px" : "";
			place(frames[i], rects[i], !intro);
			var tg = tags[i];
			if (intro) { tg.style.display = "none"; }
			else {
				tg.style.display = "flex";
				tg.style.left = (rects[i][0] + 14) + "px";
				tg.style.top = (rects[i][1] + rects[i][3] - 44) + "px";
			}
		});
		if (shareRect) {
			place(sharePanel, shareRect, true);
			var selfShare = SELF && sharer === SELF;
			sharePanel.style.background = selfShare ? "transparent" : "#000";
			for (var sid in shareFrames) shareFrames[sid].style.display = sid === sharer ? "block" : "none";
		} else {
			sharePanel.style.display = "none";
		}
		bandOv.style.display = intro ? "none" : "block";
		introOv.style.display = intro ? "block" : "none";
		document.title = "FULLPORTMATT stage · " + (intro ? "intro" : sharer ? "share" : "grid") + " · " + n;
	}

	function setLayout(name) {
		if (name !== "intro") name = "onstage";
		if (name === current) return;
		current = name;
		apply();
	}

	function layoutForScene(sceneName) {
		var s = String(sceneName || "").toLowerCase();
		if (s.indexOf("starting") !== -1 || s.indexOf("intro") !== -1) return "intro";
		return "onstage"; // Onstage + any legacy name
	}

	setLayout(q.get("layout") === "intro" ? "intro" : "onstage");
	setInterval(function () {
		if (sharerHint === null) return; // OBS: URL is the only truth
		if (sharerHint !== sharer) { sharer = sharerHint; apply(); }
	}, 300);

	if (window.obsstudio) {
		try { window.obsstudio.getCurrentScene(function (scene) { setLayout(layoutForScene(scene && scene.name)); }); } catch (e) {}
		window.addEventListener("obsSceneChanged", function (ev) { setLayout(layoutForScene(ev.detail && ev.detail.name)); });
	}
	window.addEventListener("message", function (ev) {
		var d = ev.data;
		if (!d || !d.fpmStage) return;
		if ("sharer" in d.fpmStage) sharerHint = d.fpmStage.sharer || "";
		if (d.fpmStage.layout) setLayout(d.fpmStage.layout === "intro" ? "intro" : "onstage");
		apply();
	});
	window.fpmStage = { layout: function () { return current; }, cast: function () { return cast.slice(); }, apply: apply };

	function fit() {
		if (MODE === "obs") return;
		var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
		stage.style.transform = "scale(" + s + ")";
	}
	window.addEventListener("resize", fit);
	fit();
})();
</script>
</body>
</html>
