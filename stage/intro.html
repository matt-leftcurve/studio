<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Guest/host-view copy of ~/obs-overlays/starting-soon.html, content raised so the tile strip fits below (y 770-995). -->
<style>
  html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;background:#000;}
  /* animated background: slow ken-burns zoom on the retro art, darkened */
  #bg{position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover;
    filter:brightness(0.5) saturate(1.1);
    animation:kb 26s ease-in-out infinite alternate;}
  @keyframes kb{from{transform:scale(1.0) translate(0,0);}to{transform:scale(1.12) translate(-30px,-14px);}}
  #vig{position:absolute;inset:0;background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.65) 100%);}
  #scan{position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,0.16) 0px, rgba(0,0,0,0.16) 1px, transparent 2px, transparent 4px);
    mix-blend-mode:multiply;}
  #sweep{position:absolute;left:0;width:100%;height:200px;pointer-events:none;
    background:linear-gradient(to bottom, transparent, rgba(160,220,255,0.06) 45%, rgba(160,220,255,0.1) 50%, rgba(160,220,255,0.06) 55%, transparent);
    animation:sweep 7s linear infinite;}
  @keyframes sweep{from{top:-220px;}to{top:1080px;}}

  #wrap{position:absolute;left:0;top:0;width:1920px;height:770px;display:flex;align-items:center;justify-content:center;gap:110px;
    font-family:"PingFang SC","Hiragino Sans GB","Heiti SC",sans-serif;}
  /* portrait: teal-ringed circle, gentle float */
  #pic{width:380px;height:380px;border-radius:50%;object-fit:cover;flex:none;
    border:12px solid #7fd4c1;box-shadow:0 0 0 4px rgba(10,22,30,0.9),0 18px 50px rgba(0,0,0,0.7),0 0 60px rgba(127,212,193,0.35);
    animation:float 5.5s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-16px);}}
  #col{display:flex;flex-direction:column;align-items:flex-start;}
  /* chinese logo — retro chrome gradient text */
  #logo{font-size:150px;font-weight:900;letter-spacing:14px;line-height:1;
    background:linear-gradient(180deg,#fff8e7 0%,#ffd98a 28%,#ff9d4d 46%,#e8544f 62%,#7a2f6b 82%,#3b2a5e 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 0 rgba(59,26,58,0.9)) drop-shadow(0 10px 24px rgba(0,0,0,0.65)) drop-shadow(0 0 34px rgba(255,140,80,0.35));
    animation:glow 3.2s ease-in-out infinite;}
  @keyframes glow{0%,100%{filter:drop-shadow(0 4px 0 rgba(59,26,58,0.9)) drop-shadow(0 10px 24px rgba(0,0,0,0.65)) drop-shadow(0 0 26px rgba(255,140,80,0.30));}
    50%{filter:drop-shadow(0 4px 0 rgba(59,26,58,0.9)) drop-shadow(0 10px 24px rgba(0,0,0,0.65)) drop-shadow(0 0 52px rgba(255,170,90,0.60));}}
  #tag{margin-top:26px;color:#7fd4c1;font-size:36px;font-weight:700;letter-spacing:12px;
    text-shadow:0 0 14px rgba(127,212,193,0.5);font-family:"Helvetica Neue",Helvetica,sans-serif;}
  #tagline{margin-top:12px;color:#c8b98e;font-size:26px;letter-spacing:7px;}
  #soon{margin-top:34px;color:#ffe9b0;font-size:50px;font-weight:700;letter-spacing:9px;
    text-shadow:0 0 18px rgba(255,200,100,0.55);animation:blink 1.9s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.35;}}
  #social{position:absolute;bottom:18px;width:100%;text-align:center;color:#9fe0d0;font-size:28px;
    letter-spacing:3px;font-family:"Helvetica Neue",Helvetica,sans-serif;font-weight:600;
    text-shadow:0 0 10px rgba(127,212,193,0.4);}
</style>
</head>
<body>
  <img id="bg" src="bg-laoshi.png">
  <div id="vig"></div>
  <div id="wrap">
    <img id="pic" src="matt-photo.jpg">
    <div id="col">
      <div id="logo">马特老师</div>
      <div id="tag">FULLPORTMATT</div>
      <div id="tagline">行情 · 趋势 · 机会</div>
      <div id="soon">直播马上开始…</div>
    </div>
  </div>
  <div id="social">𝕏 @fullportmatt&nbsp;&nbsp;&nbsp;·&nbsp;&nbsp;&nbsp;▶ youtube.com/@fullportmatt_zh</div>
  <div id="scan"></div>
  <div id="sweep"></div>
</body>
</html>
